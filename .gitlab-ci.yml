# .gitlab-ci.yml - GitLab CI for the Rust demo application on Zephyr.
#
# Mirrors ./Jenkinsfile: Checkout -> Toolchain -> Build -> Lint -> Boot contract -> Image
# -> Package -> Release (tags).
#
# Builds run through scripts/docker-dev.sh, so the runner only needs
# Docker (DinD) and make. The image is built from docker/Dockerfile on
# first use and then reused by the runner's Docker cache.
#
# Set the CI/CD variable GITHUB_RELEASE_TOKEN (masked, protected) to
# publish a v<version> tag build as a GitHub release.

stages:
  - build
  - test
  - analyse
  - package
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH || $CI_COMMIT_TAG'

variables:
  GIT_DEPTH: "0"
  BUILD_TYPE: "Release"
  STM32_IMAGE: "stm32-dev-rust-zephyr:latest"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""
  BASE_IMAGE: "stm32-dev:latest"
  ZEPHYR_IMAGE: "stm32-dev-zephyr:latest"

default:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  interruptible: true
  before_script:
    - apk add --no-cache bash build-base git make python3 py3-pip
    - docker version
    - |
      if ! docker image inspect "$STM32_IMAGE" >/dev/null 2>&1; then
        echo "Building $STM32_IMAGE"
        make image
      fi

build:
  stage: build
  script:
    - |
      make build
  artifacts:
    paths:
      - build/
    expire_in: 30 days

analyse:
  stage: analyse
  needs: [build]
  script:
    - |
      scripts/lint.sh

boot-contract:
  stage: test
  needs: [build]
  script:
    - |
      python3 - <<'PY'
      from pathlib import Path

      import re

      def constants(path, pattern):
          text = Path(path).read_text(encoding="utf-8")
          return {m.group(1): int(m.group(2).replace("_", "").rstrip("ULul"), 16)
                  for m in re.finditer(pattern, text)}

      rust = constants("src/platform/board.rs", r"pub const (\w+): u32 = (0x[0-9A-Fa-f_]+);")
      c = constants("platform/platform.c", r"#define (\w+)\s+(0x[0-9A-Fa-f]+U?L?)")

      expected = [
          (rust, "src/platform/board.rs", "SLOT_BASE", 0x0800C000),
          (rust, "src/platform/board.rs", "CONFIRMED_MAGIC", 0x434F4E46),
          (rust, "src/platform/board.rs", "STAY_IN_BOOT_MAGIC", 0x59415453),
          (rust, "src/platform/board.rs", "HANDOVER_MAGIC", 0x00444E48),
          (c, "platform/platform.c", "META_RUNNING_ADDR", 0x08008000),
          (c, "platform/platform.c", "META_SIZE", 0x00004000),
          (c, "platform/platform.c", "META_CONFIRMED_OFFSET", 0x140),
      ]
      for table, path, name, want in expected:
          if name not in table:
              raise SystemExit(f"boot contract: {name} is missing from {path}")
          if table[name] != want:
              raise SystemExit(f"boot contract: {name} is 0x{table[name]:08X}, expected 0x{want:08X}")

      settings = {}
      for line in Path("prj.conf").read_text(encoding="utf-8").splitlines():
          line = line.strip()
          if not line or line.startswith("#") or "=" not in line:
              continue
          key, _, value = line.partition("=")
          settings[key.strip()] = value.strip()

      expected_settings = {
          "CONFIG_FLASH_LOAD_OFFSET": "0xC000",
          "CONFIG_FLASH_LOAD_SIZE": "0xF4000",
      }
      for key, want in expected_settings.items():
          got = settings.get(key)
          if got != want:
              raise SystemExit(f"boot contract: {key} is {got!r}, expected {want!r}")

      print("boot contract: devicetree offsets and shared constants match BOOT")
      PY

image:
  stage: test
  needs: [build]
  script:
    - |
      make size
    - |
      python3 - <<'PY'
      import struct
      import zlib
      from pathlib import Path

      version = {}
      for line in Path("VERSION").read_text(encoding="utf-8").splitlines():
          if "=" in line:
              key, _, value = line.partition("=")
              version[key.strip()] = value.strip()
      want = (int(version["VERSION_MAJOR"]) << 24) | (int(version["VERSION_MINOR"]) << 16) | int(version["PATCHLEVEL"])

      path = Path("build/rust-zephyr-app.img")
      data = path.read_bytes()
      header = struct.unpack_from("<IHHIIIIIII", data, 0)
      magic, hver, hsize, itype, ver, isize, icrc, load, entry, _ts = header
      assert magic == 0x48574249, "bad image magic"
      assert hver == 1, f"unexpected header version {hver}"
      assert hsize == 256, f"unexpected header size {hsize}"
      assert itype == 1, f"unexpected image type {itype}"
      assert ver == want, f"image version 0x{ver:08X} does not match VERSION 0x{want:08X}"
      assert load == 0x0800C000, f"image loads at 0x{load:08X}, expected 0x0800C000"
      assert len(data) == hsize + isize, "image size does not match the header"
      assert zlib.crc32(data[hsize:]) & 0xFFFFFFFF == icrc, "image CRC32 mismatch"
      sp = struct.unpack_from("<I", data, hsize)[0]
      assert 0x20000000 < sp <= 0x20080000, "initial stack pointer is outside internal RAM"
      entry_ok = entry & 1 and 0x0800C000 <= (entry & ~1) < 0x0800C000 + 0x000F4000
      assert entry_ok, "reset vector is outside the slot"
      print(f"image: {path} v{(ver >> 24) & 0xFF}.{(ver >> 16) & 0xFF}.{ver & 0xFF} "
            f"({isize} bytes payload, entry 0x{entry:08X})")
      PY

package:
  stage: package
  needs: [build]
  script:
    - |
      python3 ci/package.py --name app-rust-zephyr --version "$(ci/version.sh)" build/rust-zephyr-app.elf build/rust-zephyr-app.bin build/rust-zephyr-app.hex build/rust-zephyr-app.map build/rust-zephyr-app.img README.md LICENSE
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

release:
  stage: release
  needs: [package]
  rules:
    - if: '$CI_COMMIT_TAG && $GITHUB_RELEASE_TOKEN'
  script:
    - |
      GITHUB_TOKEN="$GITHUB_RELEASE_TOKEN" python3 ci/github_release.py --tag "$CI_COMMIT_TAG" --version "$(ci/version.sh)" dist/*
